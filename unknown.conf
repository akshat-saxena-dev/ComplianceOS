# Generic Network Appliance Configuration
# Unknown vendor test

device-name branch-gateway-01

management http enable
management https enable

remote-access telnet enable
remote-access ssh enable

time-sync enable
time-server 192.168.10.10
time-server 192.168.10.11

logging enable
syslog-server 192.168.10.50
logging-level info

snmp version 2
snmp community public

interface port1
ip 10.20.1.1/24
admin-status up

interface port2
ip 10.20.2.1/24
admin-status up

firewall enable
default-policy deny

unknown-security-feature enable